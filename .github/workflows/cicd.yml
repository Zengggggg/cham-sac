name: Cham Sac Viet CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR runs can be replaced; never cancel a production release halfway through.
concurrency:
  group: cicd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: backend/.node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Validate production bundle without deployment credentials
        run: npm run build

  pipeline:
    name: Pipeline checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.node-version
      - run: node --test .github/scripts/tests/*.test.mjs

  production:
    name: Deploy production
    needs: [backend, frontend, pipeline]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.PRODUCTION_FRONTEND_URL }}
    env:
      CI: 'true'
      VERCEL_CLI_VERSION: '66.2.0'
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      PRODUCTION_BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_URL }}
      PRODUCTION_FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
      AR_SMOKE_ASSET_PATH: ${{ vars.AR_SMOKE_ASSET_PATH }}
      EXPECTED_COMMIT_SHA: ${{ github.sha }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate deployment configuration before changing production
        run: node .github/scripts/check-config.mjs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Install pinned deployment CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      # Run at repo root: Vercel's project Root Directory is frontend.
      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Check public build variables match the backend being deployed
        run: node .github/scripts/check-vercel-env.mjs
      - name: Build production artifact before deploying either service
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Stamp artifact with the release commit
        run: node .github/scripts/stamp-release.mjs
      - name: Deploy exact commit to Render and wait for that deployment
        id: render
        run: node .github/scripts/deploy-render.mjs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      - name: Verify backend readiness, commit, CORS and public AR API
        run: node .github/scripts/smoke.mjs backend
      - name: Deploy built frontend artifact
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --meta "releaseCommit=$EXPECTED_COMMIT_SHA"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify frontend routes, release commit and AR asset proxy
        run: node .github/scripts/smoke.mjs frontend
      - name: Record successful release
        run: |
          {
            echo '### Production release verified'
            echo "- Commit: $EXPECTED_COMMIT_SHA"
            echo "- Render deployment: $RENDER_DEPLOY_ID"
            echo "- Backend: $PRODUCTION_BACKEND_URL"
            echo "- Frontend: $PRODUCTION_FRONTEND_URL"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          RENDER_DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
      - name: Explain a failed release
        if: failure()
        run: |
          echo '### Release failed; inspect the first failed step' >> "$GITHUB_STEP_SUMMARY"
          echo 'Services deploy sequentially. A backend already deployed is not automatically rolled back. Follow docs/cicd/README.md.' >> "$GITHUB_STEP_SUMMARY"
