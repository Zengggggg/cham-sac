<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chạm Sắc Việt — MindAR Target Compiler</title>
    <style>
      body { margin: 0; color: #241525; background: #fff8ed; font: 16px/1.6 system-ui, sans-serif; }
      main { width: min(680px, calc(100% - 40px)); margin: 12vh auto; padding: 36px; border-radius: 24px; background: #fff; box-shadow: 0 24px 70px #5c29451f; }
      h1 { margin: 0 0 8px; }
      button { padding: 12px 20px; color: #fff; border: 0; border-radius: 999px; background: #ce337f; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .65; }
      progress { width: 100%; margin: 18px 0 8px; accent-color: #ce337f; }
    </style>
  </head>
  <body>
    <main>
      <h1>Biên dịch 7 thẻ địa danh</h1>
      <p>Công cụ nội bộ chạy hoàn toàn trên thiết bị và xuất bundle theo đúng thứ tự <code>targetIndex</code>.</p>
      <progress id="progress" max="100" value="0"></progress>
      <p id="status" role="status">Sẵn sàng.</p>
      <button id="compile" type="button">Tạo heritage-targets.mind</button>
    </main>
    <script type="module" src="/src/tools/arTargetCompiler.js"></script>
  </body>
</html>
