services:
  - type: web
    name: cham-sac-viet-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /chamsacviet/status
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: MONGODB_DB_NAME
        value: cham_sac_viet
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 30d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_FROM_NAME
        value: Chạm Sắc Việt
      - key: EMAIL_OTP_EXPIRES_MINUTES
        value: "10"
      - key: EMAIL_OTP_MAX_ATTEMPTS
        value: "5"
      - key: EMAIL_OTP_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: PAYOS_RETURN_URL
        sync: false
      - key: PAYOS_CANCEL_URL
        sync: false
      - key: SHOP_SHIPPING_FEE_VND
        value: "30000"
      - key: ORDER_PAYMENT_EXPIRES_MINUTES
        value: "15"
      - key: ORDER_EXPIRY_INTERVAL_SECONDS
        value: "60"
